<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>존.버.! — GitHub Profile</title>
    <meta name="description" content="존엄한 인내로 버텨내는 시간. 결국 맞이할 느낌표의 순간.">
    <!-- Google Fonts: Outfit (Geometric Sans) and Noto Sans KR (Korean Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Mouse tracking background glow -->
    <div class="glow-bg" id="glow-bg"></div>
    
    <!-- Fine-grain mesh overlay for texture -->
    <div class="mesh-overlay"></div>

    <!-- Main Wrapper -->
    <div class="app-container">
        
        <!-- Split Screen Container -->
        <main class="split-container" id="split-container">
            
            <!-- Column 1: 존 -->
            <section class="panel" id="panel-jon" data-index="01">
                <div class="panel-background"></div>
                <span class="panel-number">01</span>
                <div class="panel-content">
                    <h1 class="panel-letter">존</h1>
                    <div class="panel-info">
                        <h2 class="panel-subtitle">존엄한 인내</h2>
                        <p class="panel-desc">흔들리지 않는 굳건함으로 나의 중심을 잡고, 꿋꿋하게 자리를 지키며 자신을 증명해 내는 것.</p>
                    </div>
                </div>
            </section>

            <!-- Column 2: 버 -->
            <section class="panel" id="panel-beo" data-index="02">
                <div class="panel-background"></div>
                <span class="panel-number">02</span>
                <div class="panel-content">
                    <h1 class="panel-letter">버</h1>
                    <div class="panel-info">
                        <h2 class="panel-subtitle">버텨내는 시간</h2>
                        <p class="panel-desc">시간의 무게 속에서 조용히 내공을 쌓으며, 매서운 바람 속에서도 내일을 위해 전진하는 과정.</p>
                    </div>
                </div>
            </section>

            <!-- Column 3: ! -->
            <section class="panel" id="panel-excl" data-index="03">
                <div class="panel-background"></div>
                <span class="panel-number">03</span>
                <div class="panel-content">
                    <h1 class="panel-letter">!</h1>
                    <div class="panel-info">
                        <h2 class="panel-subtitle">느낌표의 순간</h2>
                        <p class="panel-desc">끝까지 견뎌낸 이들에게 마침내 허락되는 확신의 증표이자, 새로운 시작을 알리는 경탄의 울림.</p>
                    </div>
                </div>
            </section>

        </main>

        <!-- Footer Overlay -->
        <footer class="profile-footer">
            <span class="footer-item">STATUS / HOLDING THE LINE</span>
            <span class="footer-separator"></span>
            <span class="footer-item">© 2026 VIBE CODING. ALL RIGHTS RESERVED.</span>
        </footer>

    </div>
</body>
</html>
